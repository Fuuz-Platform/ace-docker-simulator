# The console and the services share an origin.
#
# The browser only ever talks to this server: static assets from /, and every service under /api/*.
# That removes CORS from the picture entirely (no preflights, no wildcard headers on the services)
# and means the React app has one set of paths whether it is running behind Vite in dev or behind
# nginx in Docker.
server {
  listen 8080;
  server_name _;

  # Docker's embedded DNS, re-resolved rather than cached at startup: a service that restarts gets
  # a new container IP, and without this nginx would keep proxying to the dead one until reloaded.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location /healthz { access_log off; return 200 "ok\n"; }

  # NOTE on the rewrites below: when proxy_pass contains a VARIABLE, nginx does not perform its
  # usual prefix replacement — it forwards the original URI untouched. The resolver directive above
  # requires the variable form, so each location must strip its own prefix explicitly.
  location /api/sim/ {
    set $sim http://ace-sim:4841;
    rewrite ^/api/sim/(.*)$ /$1 break;
    proxy_pass $sim;
    proxy_set_header Host $host;
  }

  location /api/orch/ {
    set $orch http://ace-orchestrator:8099;
    rewrite ^/api/orch/(.*)$ /$1 break;
    proxy_pass $orch;
    proxy_set_header Host $host;
    # embedding and matching calls can be slow; do not cut them off at the default 60s
    proxy_read_timeout 300s;
  }

  location /api/hist/ {
    set $histsvc http://ace-graphql:8098;
    rewrite ^/api/hist/(.*)$ /$1 break;
    proxy_pass $histsvc;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  # The device gateway's HTTP relay, which triggers edge data flows on demand. It lives on a
  # published gateway port (5500-5550) rather than the container network, because the gateway runs
  # in its own compose project that this stack does not share a network with.
  location /api/edge/ {
    set $edge http://host.docker.internal:5510;
    rewrite ^/api/edge/(.*)$ /$1 break;
    proxy_pass $edge;
    proxy_set_header Host $host;
    # a harvest run pulls, shapes and writes hundreds of rollups; do not cut it off at 60s
    proxy_read_timeout 300s;
  }

  # Docker Model Runner's OpenAI-compatible surface, proxied so the console can read the runtime's
  # OWN account of itself — model id, parameter count, quantization, context window — rather than
  # repeating what someone typed into an env var. Reached on the published host port rather than
  # model-runner.docker.internal because that name resolves for containers, not for the browser.
  location /api/models/ {
    # The variable holds HOST ONLY. A path in a variable proxy_pass is not used as a prefix — the
    # rewritten URI replaces it outright — so the engine path belongs in the rewrite, like every
    # other location here.
    set $mr http://host.docker.internal:12434;
    rewrite ^/api/models/(.*)$ /engines/v1/$1 break;
    proxy_pass $mr;
    proxy_set_header Host $host;
    # a cold model loads on first call; a latency probe must not be cut off mid-load
    proxy_read_timeout 300s;
  }

  # SPA fallback — the console routes on the hash, but a hard refresh on any path must still boot.
  location / { try_files $uri $uri/ /index.html; }
}
